name: Part 1 - Arena reanalysis

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Hugging Face dataset id
        default: lmarena-ai/arena-human-preference-55k
  push:
    paths:
      - "src/**"
      - "scripts/01_arena_idk.py"
      - ".github/workflows/arena.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.dataset || 'lmarena-ai/arena-human-preference-55k' }}

      - name: Run analysis
        run: python scripts/01_arena_idk.py --dataset "${{ inputs.dataset || 'lmarena-ai/arena-human-preference-55k' }}"

      - name: Commit results back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No changes to results."
          else
            git commit -m "Update Part 1 results [skip ci]"
            git push
          fi
